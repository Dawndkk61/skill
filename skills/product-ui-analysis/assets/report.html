<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>产品界面分析</title>
<style>
:root{color-scheme:light;--paper:#fafafa;--ink:#202020;--muted:#737373;--line:#dedede}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}a{color:inherit;text-decoration:none}a:hover{text-decoration:underline}button{font:inherit;cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid #333;outline-offset:3px}aside{position:fixed;inset:0 auto 0 0;width:240px;overflow:auto;background:#f2f2f2;border-right:1px solid var(--line);padding:28px 18px}aside strong{font-size:17px}aside .label{font-size:10px;letter-spacing:2px;color:var(--muted);margin:28px 10px 8px}aside a{display:block;padding:8px 10px;border-radius:5px;font-size:12px}aside a.current{background:#e2e2e2;font-weight:600}main{margin-left:240px;padding:48px clamp(22px,4vw,70px);max-width:1800px}.eyebrow{font:10px ui-monospace,monospace;letter-spacing:2px;text-transform:uppercase;color:var(--muted)}h1{font-size:44px;line-height:1.2;letter-spacing:-1.6px;margin:24px 0}h2{font-size:26px;margin:8px 0 20px}h3{font-size:17px;margin:0 0 12px}p{margin:8px 0}.intro{max-width:830px;color:var(--muted);margin-bottom:28px}.category{margin:42px 0;scroll-margin-top:24px}.table-box{background:white;border:1px solid var(--line);border-radius:8px;overflow:hidden}.table-title{padding:20px 22px;background:#f1f1f1;display:flex;justify-content:space-between;gap:16px;align-items:center}.table-title h3{margin:0}.table-title small{color:var(--muted)}.tabs{display:flex;gap:12px;padding:0 20px;background:#fafafa;border-bottom:1px solid var(--line);overflow:auto}.tabs button{flex-shrink:0;border:0;border-bottom:3px solid transparent;background:none;color:#777;padding:17px 16px}.tabs button[aria-selected=true]{border-bottom-color:#333;color:#161616;background:#eee;font-weight:600}[hidden]{display:none!important}.panel-note{padding:12px 22px;color:var(--muted);font-size:11px;background:#fcfcfc}.scroll{overflow:auto;max-width:100%}table{width:100%;border-collapse:collapse;table-layout:fixed;min-width:720px;font-size:12px}th,td{text-align:left;padding:15px 18px;border-top:1px solid var(--line);border-right:1px solid #eee;vertical-align:top;overflow-wrap:anywhere}th{font-size:11px;color:#666;background:#f6f6f6}td:last-child,th:last-child{border-right:0}th:first-child{width:28%}td small{display:block;color:#777;font-size:10px;margin:6px 0}code{font:11px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace}.value{display:flex;gap:18px;flex-wrap:wrap}.value>div{display:flex;flex-direction:column;gap:5px}.swatch{display:inline-flex;align-items:center;gap:8px}.swatch i{width:24px;height:24px;border:1px solid #0002;border-radius:4px;display:inline-block}.tag{display:inline-block;padding:2px 6px;background:#f0f0f0;border:1px solid #ddd;border-radius:4px;font-size:10px;color:#555}.links{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.links a{background:#fafafa;border:1px solid #ddd;border-radius:4px;padding:6px 8px;font-size:10px}.links a small{margin:0;font-size:9px}.bar{height:7px;width:140px;max-width:100%;background:#eee;margin-top:9px}.bar i{display:block;height:100%;background:#888}.binding{margin-bottom:8px}.binding small{margin:0}.evidence-target{outline:2px solid #555;outline-offset:-2px;scroll-margin-top:24px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;margin:20px 0}.modes{display:flex;gap:5px;border:1px solid #ddd;background:#eee;padding:4px;border-radius:6px}.modes button{border:0;background:none;padding:7px 16px;border-radius:3px;color:#777}.modes button[aria-pressed=true]{background:white;color:#222}.source{width:100%;background:#eee;border:1px solid var(--line);border-radius:8px;overflow:hidden}.source img{display:block;width:100%;height:auto}.source-caption{font:10px/1.8 ui-monospace,monospace;color:#777;margin-top:8px;overflow-wrap:anywhere}.action{padding:7px 12px;border:1px solid #ccc;background:white;border-radius:5px}.component{border:1px solid var(--line);background:white;border-radius:8px;padding:25px;margin:22px 0;scroll-margin-top:24px}.component-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}.crop{background:#f1f1f1;border:1px solid #e5e5e5;padding:18px;border-radius:5px;display:flex;align-items:center;justify-content:center;min-height:140px}.crop img{max-width:100%;height:auto;max-height:500px;object-fit:contain}.component ul{padding-left:18px}.component .section-label{font-size:11px;font-weight:600;margin:18px 0 5px}dialog{width:min(95vw,1600px);max-height:95vh;padding:16px;border:1px solid #bbb;border-radius:8px}dialog img{width:100%;display:block;margin-top:12px}dialog::backdrop{background:#0009}.empty{color:#888;padding:15px}.foot{font-size:11px;color:#777;border-top:1px solid #ddd;margin:35px 0 0;padding-top:20px}@media(max-width:760px){aside{position:static;width:auto;padding:20px}aside a{display:inline-block}aside .label{margin:15px 10px 5px}main{margin:0;padding:30px 20px}h1{font-size:34px}.table-title{display:block}.table-title small{display:block;margin-top:8px}.tabs{padding:0 8px;gap:0}.tabs button{padding:14px 12px;font-size:12px}.component-grid{grid-template-columns:1fr}.component{padding:18px}}@media print{aside{display:none}main{margin:0}.component{break-inside:avoid}.tabs button:not([aria-selected=true]){display:none}}
.product-brand{display:flex;align-items:center;gap:9px}.product-logo{display:block;flex-shrink:0;width:22px;height:22px;object-fit:contain}
/* PRODUCT_UI_COMPONENT_VARIABLES_STYLE v1 */
.component-variables{grid-column:1/-1;align-self:start;min-width:0;background:#fafafa;border:1px solid #e5e5e5;border-radius:6px;padding:16px}
.component-variable-header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.component-variable-header strong{font-size:13px;line-height:1.5}.component-variable-header span{font-size:10px;color:#777;white-space:nowrap}
.component-variable-groups{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(210px,100%),1fr));gap:20px 24px}
.component-variable-group{min-width:0}.component-variable-group h4{font-size:10px;font-weight:500;color:#777;margin:0 0 10px;padding-bottom:6px;border-bottom:1px solid #e4e4e4}
.component-variable{margin:0 0 13px;min-width:0}.component-variable:last-child{margin-bottom:0}
.component-variable-label{display:flex;justify-content:space-between;gap:8px;align-items:start;line-height:1.5}
.component-variable-label a{font-size:11px;font-weight:500;overflow-wrap:anywhere}.component-variable-label .tag{flex-shrink:0;font-size:9px;padding:1px 4px;line-height:1.5}
.component-variable-value{display:flex;align-items:center;gap:7px;font-size:12px;line-height:1.6;margin-top:4px;overflow-wrap:anywhere}
.component-variable-value i{display:block;flex-shrink:0;width:15px;height:15px;border:1px solid #0002;border-radius:3px}
.component-variable-value code{font-size:11px}.component-variable-alias{display:block;font:9px/1.6 ui-monospace,monospace;color:#888;overflow-wrap:anywhere;margin-top:3px}
.component-variable-tolerance{font-size:9px;line-height:1.6;color:#777;display:block}.component-variable-empty{font-size:11px;color:#888;margin:0}
@media(min-width:1500px){.component-with-variables .component-grid{grid-template-columns:minmax(0,.95fr) minmax(0,1.1fr) minmax(230px,.85fr);gap:24px}.component-variables{grid-column:auto}.component-variable-groups{grid-template-columns:1fr;gap:18px}}
@media(max-width:1050px){.component-with-variables .component-grid{grid-template-columns:1fr}.component-variables{grid-column:auto}}
/* END_PRODUCT_UI_COMPONENT_VARIABLES_STYLE */
</style></head><body><aside id="nav"></aside><main id="main"></main><dialog id="original"><button class="action" id="close-original">关闭 ×</button><img alt="原始证据截图"></dialog>
<script id="analysis-data" type="application/json">__PAYLOAD__</script>
<script>
const data=JSON.parse(document.getElementById('analysis-data').textContent);
const categories={colors:'颜色',radius:'圆角',spacing:'间距',borders:'描边',text:'文字 / 字体',weight:'字重',size:'字号'};
const evidenceNames={observation:'观察事实',sample:'像素取样',estimate:'几何估算',config:'配置明示',inference:'设计推断',unknown:'待核实'};
const selectedLayers={},selectedModes={};let currentPage=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const route=(view,target='')=>'#view='+encodeURIComponent(view)+(target?'&target='+encodeURIComponent(target):'');
const vals=v=>'values' in v?v.values:{Default:v.value};
const pageFor=id=>data.pages.find(p=>p.id===id);
function value(v){return '<div class="value">'+Object.entries(vals(v)).map(([mode,x])=>'<div><small>'+esc(mode)+'</small>'+(x===null?'<span>未核实</span>':v.kind==='color'?'<span class="swatch"><i style="background:'+esc(x)+'"></i><code>'+esc(x.toUpperCase())+'</code></span>':'<span>'+esc(x)+(v.unit?' '+esc(v.unit):'')+'</span>')+'</div>').join('')+'</div>'}
function refs(v){const unique=new Map();for(const r of v.applications)unique.set(r.page+'/'+r.component,r);return '<div class="links">'+[...unique.values()].map(r=>{const p=pageFor(r.page),c=p.components.find(c=>c.id===r.component);return '<a href="'+route(p.id,'component-'+c.id)+'" title="'+esc(r.property+' · '+(r.relation||''))+'"><small>'+esc(p.title)+'</small>'+esc(c.name)+' ↗</a>'}).join('')+'</div>'}
function table(head,rows){return '<div class="scroll" tabindex="0" role="region" aria-label="变量表格"><table><thead><tr>'+head.map(s=>'<th scope="col">'+s+'</th>').join('')+'</tr></thead><tbody>'+rows+'</tbody></table></div>'}
function panel(type,layer,note,head,rows){return '<section id="panel-'+type+'-'+layer+'" data-layer="'+layer+'" role="tabpanel" aria-labelledby="tab-'+type+'-'+layer+'" '+((selectedLayers[type]||'primitive')===layer?'':'hidden')+'><p class="panel-note">'+note+'</p>'+table(head,rows)+'</section>'}
function variableCategory(type,variables){
 const numeric=(a,b)=>{if(a.kind==='number'&&b.kind==='number')return String(a.unit).localeCompare(String(b.unit))||(a.value??0)-(b.value??0);return 0};
 const vs=[...variables].sort(numeric),groups=new Map();
 for(const v of vs){const key=JSON.stringify([v.kind,v.unit||'',vals(v),v.evidence.type]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(v)}
 const raw=[...groups.values()].map((group,i)=>{const v=group[0],max=Math.max(1,...vs.filter(x=>x.unit===v.unit&&typeof x.value==='number').map(x=>x.value));return '<tr><td><code>raw/'+type+'/'+String(i+1).padStart(2,'0')+'</code><small>'+group.length+' 个用途候选</small></td><td>'+value(v)+(v.kind==='number'&&typeof v.value==='number'?'<div class="bar"><i style="width:'+Math.max(0,Math.min(100,v.value/max*100))+'%"></i></div>':'')+'</td><td>'+group.map(x=>'<a href="'+route('variables','variable-'+x.id)+'">'+esc(x.label)+' ↗</a>').join('<br>')+'</td></tr>'}).join('');
 const semantic=vs.map(v=>'<tr id="variable-'+v.id+'"><td><code>'+esc(v.name)+'</code><small>'+esc(v.label)+'</small>'+(v.note?'<small>'+esc(v.note)+'</small>':'')+'</td><td>'+value(v)+'</td><td><span class="tag">'+esc(evidenceNames[v.evidence.type])+'</span><small>'+esc(v.evidence.note||'')+'</small>'+refs(v)+'</td></tr>').join('');
 const components=new Map();for(const v of vs)for(const ref of v.applications){const key=ref.page+'/'+ref.component;if(!components.has(key))components.set(key,{ref,vs:[]});components.get(key).vs.push({v,ref})}
 const component=[...components.values()].map(({ref,vs})=>{const p=pageFor(ref.page),c=p.components.find(c=>c.id===ref.component);return '<tr><td><a href="'+route(p.id,'component-'+c.id)+'">'+esc(c.name)+' ↗</a><small>'+esc(p.title)+'</small></td><td>'+vs.map(({v,ref})=>'<div class="binding"><small>'+esc(ref.property)+'</small><a href="'+route('variables','variable-'+v.id)+'"><code>'+esc(v.name)+'</code> ↗</a></div>').join('')+'</td><td>'+[...new Set(vs.map(({ref})=>ref.relation||'应用候选'))].map(s=>'<span class="tag">'+esc(s)+'</span>').join(' ')+'</td></tr>'}).join('');
 return '<section class="category" id="category-'+type+'"><div class="eyebrow">DESIGN VARIABLES</div><h2>'+categories[type]+'</h2><div class="table-box" data-category="'+type+'"><div class="table-title"><h3>变量表格总览</h3><small>'+groups.size+' 原始值组 · '+vs.length+' 用途候选 · '+components.size+' 组件</small></div><div class="tabs" role="tablist" aria-label="'+categories[type]+'变量层级">'+[['primitive','01 / 原始层'],['semantic','02 / 语义层'],['component','03 / 组件层']].map(([layer,title])=>'<button role="tab" id="tab-'+type+'-'+layer+'" data-tab="'+layer+'" aria-controls="panel-'+type+'-'+layer+'" aria-selected="'+String((selectedLayers[type]||'primitive')===layer)+'" tabindex="'+((selectedLayers[type]||'primitive')===layer?'0':'-1')+'">'+title+'</button>').join('')+'</div>'+panel(type,'primitive','只展示已有取值；编号为本报告生成，不代表产品原生变量。',['Name / 报告编号','Value / 原始值','对应用途'],raw)+panel(type,'semantic','用途命名及映射为建议，未验证源码绑定。',['Name / 用途名称','Value / 原始值','依据与范围'],semantic)+panel(type,'component','点击组件直达对应页面的截图和完整分析。',['Component / 页面与组件','Property → Variable','关系依据'],component)+'</div></section>';
}
function variableView(){const surface=data.surface?' · '+esc(data.surface):'',conclusion=data.conclusion?esc(data.conclusion)+' ':'';return '<div class="eyebrow">PRODUCT UI ANALYSIS'+surface+'</div><h1>'+esc(data.product)+surface+'<br>跨页设计变量</h1><p class="intro">'+conclusion+'截图观察、像素取样、几何估算与设计推断分别标记。语义名称和组件绑定为候选，不能等同源码。截图和色块保留原色，分析画布使用黑白灰。</p>'+Object.keys(categories).map(type=>{const vs=data.variables.filter(v=>v.category===type);return vs.length?variableCategory(type,vs):''}).join('')}
function list(items){return items?.length?'<ul>'+items.map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>':'<p class="empty">未记录</p>'}

/* PRODUCT_UI_COMPONENT_VARIABLES v1 */
function componentVariableValue(v,mode){
 const record=v.standard||v,hasModes='values' in record,knownMode=!hasModes||Object.prototype.hasOwnProperty.call(record.values,mode),x=hasModes?record.values[mode]:record.value;
 const unit=record.unit==='standard-px'?'标准 px':record.unit||'';
 if(!knownMode)return '<span>当前主题未记录</span>';
 if(x===null||x===undefined)return '<span>未知</span>';
 if(v.kind==='color')return '<i style="background:'+esc(x)+'" aria-hidden="true"></i><code>'+esc(String(x).toUpperCase())+'</code>';
 return '<span>'+esc(x)+(unit?' '+esc(unit):'')+'</span>';
}
function componentVariables(p,c,mode){
 const entries=data.variables.flatMap(v=>{const refs=v.applications.filter(a=>a.page===p.id&&a.component===c.id);return refs.length?[{v,property:[...new Set(refs.map(a=>a.property||v.label))].join(' / ')}]:[]});
 const theme={light:'浅色',dark:'深色'}[mode]||mode;
 const groups=Object.entries(categories).map(([category,label])=>{
  const rows=entries.filter(e=>e.v.category===category);if(!rows.length)return '';
  return '<div class="component-variable-group" data-variable-category="'+esc(category)+'"><h4>'+esc(label)+' · '+rows.length+'</h4>'+rows.map(({v,property})=>
   '<div class="component-variable" data-variable-id="'+esc(v.id)+'"><div class="component-variable-label"><a href="'+route('variables','variable-'+v.id)+'" aria-label="'+esc(property+'，查看变量记录')+'">'+esc(property)+' ↗</a><span class="tag">'+esc(evidenceNames[v.evidence.type]||v.evidence.type)+'</span></div><div class="component-variable-value">'+componentVariableValue(v,mode)+'</div>'+(v.standard?.tolerance?'<small class="component-variable-tolerance">'+esc(v.standard.tolerance)+'</small>':'')+'<code class="component-variable-alias">'+esc(v.name)+'</code></div>'
  ).join('')+'</div>';
 }).join('');
 return '<section class="component-variables" aria-label="'+esc(c.name+'对应设计变量')+'" data-component="'+esc(p.id+'/'+c.id)+'" data-variable-theme="'+esc(mode)+'"><div class="component-variable-header"><strong>对应设计变量</strong><span>'+esc(theme)+' · '+entries.length+' 条候选</span></div>'+(entries.length?'<div class="component-variable-groups">'+groups+'</div>':'<p class="component-variable-empty">暂无对应变量记录</p>')+'</section>';
}

/* END_PRODUCT_UI_COMPONENT_VARIABLES */
function pageView(p){const modes=Object.keys(p.sources),mode=selectedModes[p.id]||modes[0],s=p.sources[mode];currentPage={p,mode};return '<div class="eyebrow">PAGE ANALYSIS</div><h1>'+esc(p.title)+'</h1><div class="toolbar"><div class="modes">'+modes.map(m=>'<button data-mode="'+esc(m)+'" aria-pressed="'+String(m===mode)+'">'+esc(m)+'</button>').join('')+'</div><button class="action" id="show-original">查看原图</button></div><p class="intro">'+esc(s.state||'可见状态未补充')+'</p><div class="source"><img src="'+s.image+'" width="'+s.width+'" height="'+s.height+'" alt="'+esc(p.title+' '+mode+' 原始截图')+'"></div><p class="source-caption">'+esc(s.path)+' · '+s.width+'×'+s.height+' · '+esc(s.colorSpace||'色彩空间未核实')+' · SHA-256 '+s.sha256+'</p><section id="components"><h2>组件分析</h2>'+p.components.map(c=>'<article class="component component-with-variables" id="component-'+c.id+'"><h3>'+esc(c.name)+'</h3><div class="component-grid"><div><div class="crop">'+(c.images?.[mode]?'<img src="'+c.images[mode]+'" alt="'+esc(c.name+' '+mode+' 原图裁切')+'">':'<p class="empty">本模式未记录裁切；请查看原图</p>')+'</div><p class="source-caption">'+(c.bounds?.[mode]?'原图坐标 ['+c.bounds[mode].join(', ')+']':'')+'</p></div><div><div class="section-label">观察事实</div>'+list(c.facts)+'<div class="section-label">几何估算</div>'+list((c.estimates||[]).map(x=>x.property+'：'+x.value+' '+x.unit+(x.tolerance?'（'+x.tolerance+'）':'')))+'<div class="section-label">设计推断</div>'+list(c.inferences)+'<div class="section-label">限制与备注</div>'+list(c.notes)+'</div>'+componentVariables(p,c,mode)+'</div></article>').join('')+'</section>'}
function activateTab(button){const box=button.closest('[data-category]'),type=box.dataset.category,layer=button.dataset.tab;selectedLayers[type]=layer;box.querySelectorAll('[data-tab]').forEach(b=>{b.setAttribute('aria-selected',String(b===button));b.tabIndex=b===button?0:-1});box.querySelectorAll('[data-layer]').forEach(p=>p.hidden=p.dataset.layer!==layer)}
function productBrand(){const logo=data.brand?.logo;return '<div class="product-brand">'+(logo?.image?'<img class="product-logo" src="'+esc(logo.image)+'" width="22" height="22" alt="" aria-hidden="true" style="mix-blend-mode:'+esc(logo.blendMode||'normal')+'">':'')+'<strong>'+esc(data.product)+'</strong></div>'}
function render(){const args=new URLSearchParams(location.hash.slice(1)),view=args.get('view')||'variables',target=args.get('target'),p=pageFor(view);document.title=data.product+' / '+(p?p.title:'跨页设计变量');document.getElementById('nav').innerHTML=productBrand()+'<div class="label">设计变量</div><a class="'+(!p?'current':'')+'" href="'+route('variables')+'">跨页设计变量</a>'+Object.keys(categories).filter(t=>data.variables.some(v=>v.category===t)).map(t=>'<a href="'+route('variables','category-'+t)+'">'+categories[t]+'</a>').join('')+'<div class="label">产品页面</div>'+data.pages.map(x=>'<a class="'+(p?.id===x.id?'current':'')+'" href="'+route(x.id)+'">'+esc(x.title)+'</a>').join('');document.getElementById('main').innerHTML=(p?pageView(p):variableView())+'<div class="foot">报告基于已提供的截图与明确记录；未采集的主题和交互状态保持未知。</div>';requestAnimationFrame(()=>{document.querySelectorAll('.evidence-target').forEach(e=>e.classList.remove('evidence-target'));const el=target?document.getElementById(target):null;if(el){const panel=el.closest('[data-layer]');if(panel?.hidden)activateTab(panel.closest('[data-category]').querySelector('[data-tab='+panel.dataset.layer+']'));el.classList.add('evidence-target');el.scrollIntoView({block:'start'})}else scrollTo(0,0)})}
document.addEventListener('click',event=>{const tab=event.target.closest('[data-tab]');if(tab)activateTab(tab);const mode=event.target.closest('[data-mode]');if(mode){const y=scrollY;selectedModes[currentPage.p.id]=mode.dataset.mode;document.getElementById('main').innerHTML=pageView(currentPage.p);scrollTo(0,y)}if(event.target.closest('#show-original')){document.querySelector('#original img').src=currentPage.p.sources[currentPage.mode].image;document.getElementById('original').showModal()}const a=event.target.closest('a');if(a?.getAttribute('href')===location.hash){event.preventDefault();render()}});
document.addEventListener('keydown',event=>{const tab=event.target.closest('[data-tab]');if(!tab||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;event.preventDefault();const tabs=[...tab.closest('[role=tablist]').querySelectorAll('button')],i=tabs.indexOf(tab),j=event.key==='Home'?0:event.key==='End'?tabs.length-1:(i+(event.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;activateTab(tabs[j]);tabs[j].focus()});
document.getElementById('close-original').onclick=()=>document.getElementById('original').close();window.addEventListener('hashchange',render);render();
</script></body></html>
